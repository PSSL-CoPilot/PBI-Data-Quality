name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `npm run build` runs tsc first, so this covers typechecking too.
      - run: npm run build
