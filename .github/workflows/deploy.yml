name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy must never race another deploy, but queued pushes should still land.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Broken code must not reach production, so the same gates as CI run first.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      # Without this the first failure would be an opaque wrangler auth error.
      # D1 is optional: analysis runs entirely in the browser, so the app is
      # usable without it and only version history is lost.
      - name: Check deploy credentials
        id: creds
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions." >&2
            echo "See the Deploying section of README.md for how to obtain each one." >&2
            exit 1
          fi
          if [ -n "${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}" ]; then
            echo "d1=true" >> "$GITHUB_OUTPUT"
          else
            echo "d1=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_D1_DATABASE_ID is not set. Deploying without a database: analysis works, version history does not."
          fi

      - name: Build
        run: npm run build
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'pbi-quality-studio' }}

      # `migrations_dir` in the generated config is relative to the config file,
      # which the build writes to dist/server, so the SQL has to sit beside it.
      - name: Stage migrations next to the built config
        if: steps.creds.outputs.d1 == 'true'
        run: cp -r drizzle dist/server/drizzle

      # Applies only migrations that have not run yet; safe to repeat.
      - name: Apply D1 migrations
        if: steps.creds.outputs.d1 == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
