name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages needs these to publish; nothing else in the repo requires secrets.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but do not drop a queued one either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Broken code must not reach the published site.
      - run: npm run lint
      - run: npm test

      # `actions/configure-pages` is deliberately not used.
      #
      # It was here only to resolve the base path, which vite.config.ts now
      # derives itself from GITHUB_REPOSITORY. Keeping it made the workflow
      # depend on the token being allowed to create a Pages site, and where that
      # is not permitted the run dies with "Resource not accessible by
      # integration" before a single file is built. Dropping it removes a
      # failure mode without losing anything.
      #
      # Publishing still requires Pages to be enabled on the repository with
      # its source set to GitHub Actions. That is a repository setting and no
      # workflow can turn it on for you when the token lacks the permission.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
