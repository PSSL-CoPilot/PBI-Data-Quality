name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages needs these to publish; nothing else in the repo requires secrets.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but do not drop a queued one either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Broken code must not reach the published site.
      - run: npm run lint
      - run: npm test

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turns Pages on for the repo if it is not already, so no manual
          # settings change is needed before the first deploy.
          enablement: true

      # Pages serves the site from /<repo>/, which configure-pages resolves.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
